name: Deploy repositorio to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['repositorio/**', '.github/workflows/deploy-repositorio.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage repositorio
        run: |
          set -e
          if [ ! -d repositorio ]; then
            echo "::error::A pasta 'repositorio/' nao existe na branch main deste repositorio. Faz push dela primeiro."
            exit 1
          fi
          mkdir -p _site/repositorio
          cp -r repositorio/. _site/repositorio/
          echo '<!doctype html><meta charset="utf-8"><title>JulogicIDE</title><h1>JulogicIDE</h1><p><a href="repositorio/index.json">repositorio/index.json</a></p>' > _site/index.html
          ls -R _site


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
